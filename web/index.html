<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vani Call Audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  /* identity: a quality-control desk for phone calls. Cool teal-tinted neutrals, one deep teal accent, status colours kept for verdicts only. */
  --display:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;--body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --bg:#EEF2F2;--panel:#FFFFFF;--ink:#0F1C1F;--ink2:#34464A;--muted:#5F7175;--line:#D9E1E2;--line2:#ECF0F1;
  --brand:#0B6E6B;--brand-ink:#FFFFFF;--brand-soft:#DCEFEE;
  --pass:#1B7F4B;--pass-bg:#E0F2E7;--nf:#9A5B00;--nf-bg:#FBEACB;--fatal:#BA2D2D;--fatal-bg:#FBE2DF;--na:#5F7175;--na-bg:#E7EDEE;
  --bot:#E6F1F1;--buyer:#EEF2E8;--shadow:0 1px 0 rgba(15,28,31,.04),0 6px 18px rgba(15,28,31,.05);
  --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--grid:#E3E9EA;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1416;--panel:#111D20;--ink:#E6EEEF;--ink2:#BDCBCD;--muted:#8CA0A3;--line:#233438;--line2:#1A2A2E;
  --brand:#41B8B1;--brand-ink:#08201F;--brand-soft:#12353A;
  --pass:#5BD39B;--pass-bg:#10322A;--nf:#F2B65A;--nf-bg:#3A2D12;--fatal:#FF8B86;--fatal-bg:#3D1D1D;--na:#8CA0A3;--na-bg:#1C2B2F;
  --bot:#14292D;--buyer:#1A2C22;--shadow:0 1px 0 rgba(0,0,0,.3);
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--grid:#1C2B2F;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1416;--panel:#111D20;--ink:#E6EEEF;--ink2:#BDCBCD;--muted:#8CA0A3;--line:#233438;--line2:#1A2A2E;
  --brand:#41B8B1;--brand-ink:#08201F;--brand-soft:#12353A;
  --pass:#5BD39B;--pass-bg:#10322A;--nf:#F2B65A;--nf-bg:#3A2D12;--fatal:#FF8B86;--fatal-bg:#3D1D1D;--na:#8CA0A3;--na-bg:#1C2B2F;
  --bot:#14292D;--buyer:#1A2C22;--shadow:0 1px 0 rgba(0,0,0,.3);
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--grid:#1C2B2F;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:318px minmax(0,1fr);min-height:100vh}
@media(max-width:900px){.shell{grid-template-columns:1fr}}
.side{background:var(--panel);border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow:auto}
@media(max-width:900px){.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}}
.brand{display:flex;align-items:center;gap:10px;font:700 16px/1.2 var(--display);letter-spacing:-.01em}
.logo{width:30px;height:30px;border-radius:7px;background:var(--brand);display:grid;place-items:center;color:var(--brand-ink)}
.sub{color:var(--muted);font-size:12px;font-weight:400;display:block;margin-top:-2px}
.label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:0 0 8px}
.drop{border:1.5px dashed #c3c9d8;border-radius:12px;padding:20px 12px;text-align:center;color:var(--muted);cursor:pointer;background:var(--bg);transition:.15s}
.drop:hover,.drop.over{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.drop b{display:block;color:var(--ink);font-weight:600;margin-top:6px}
.drop svg{width:26px;height:26px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 9px;font-size:12px;color:var(--ink2)}
.sbtn:hover{border-color:var(--brand);color:var(--brand)}
.jobs{display:flex;flex-direction:column;gap:6px}
.job{border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;background:var(--panel);display:grid;gap:3px}
.job:hover{border-color:#b9c2da}.job.sel{border-color:var(--brand);background:var(--brand-soft)}
.job{min-width:0;overflow:hidden}.job .row{min-width:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.job .fn{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job .when{font-size:11px;color:var(--muted)}
.paste{margin-top:12px;font-size:13px}.paste summary{cursor:pointer;color:var(--brand);font-weight:600}
.field{display:block;width:100%;margin:8px 0;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px;resize:vertical}
.nav{display:grid;gap:2px}.navbtn{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:7px;padding:8px 10px;font:600 13.5px var(--body);color:var(--ink2);text-align:left}
.navbtn:hover{background:var(--bg)}.navbtn.on{background:var(--brand-soft);color:var(--brand)}
.navbtn:focus-visible,.btn:focus-visible,summary:focus-visible,.job:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.mx{border-collapse:collapse;font-size:13px}.mx th,.mx td{padding:6px 12px;border:1px solid var(--line);text-align:center}.mx th{color:var(--muted);font-weight:600;font-size:12px}
.mx td.hit{background:var(--pass-bg);color:var(--pass);font-weight:700}.mx td.bad{background:var(--fatal-bg);color:var(--fatal);font-weight:700}.mx td.z{color:var(--muted)}
.bcall{border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--panel)}
.bcall summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:120px 1fr 1fr 120px 90px;gap:10px;align-items:center;padding:9px 12px}
.bcall summary::-webkit-details-marker{display:none}
@media(max-width:760px){.bcall summary{grid-template-columns:1fr 1fr}}
.dline{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line2);font-size:13px}

/* ---------- overview ---------- */
.ov{display:grid;gap:30px;max-width:none}
.ov h1{font:700 clamp(28px,4.2vw,40px)/1.08 var(--display);letter-spacing:-.025em;margin:0;text-wrap:balance;max-width:20ch}
.ov h2{font:700 20px/1.2 var(--display);letter-spacing:-.015em;margin:0}
.eyebrow{font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--brand);margin:0 0 10px}
.lede{font-size:17px;line-height:1.55;color:var(--ink2);max-width:62ch;margin:14px 0 0}
.lede b{color:var(--ink)}
.provenance{font:400 12px var(--mono);color:var(--muted);margin-top:12px}
.sect-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.sect-head p{margin:0;color:var(--muted);font-size:13px;max-width:60ch}
.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.flow li{padding:14px 16px;display:grid;gap:3px;border-right:1px solid var(--line);min-width:0}
.flow li:last-child{border-right:0}
.flow .st{display:flex;align-items:center;gap:8px;font:600 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.flow .dot{width:10px;height:10px;border-radius:50%;border:2px solid currentColor;flex:none}
.flow .done .dot{background:var(--pass);border-color:var(--pass)}.flow .done .st{color:var(--pass)}
.flow .todo .st{color:var(--nf)}
.flow b{font:700 15px var(--display)}.flow span.d{font-size:13px;color:var(--ink2)}
@media(max-width:760px){.flow{grid-template-columns:1fr 1fr}.flow li:nth-child(2){border-right:0}.flow li:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.guide{border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.guide>summary{cursor:pointer;list-style:none;padding:14px 18px;font:700 15px var(--display);display:flex;justify-content:space-between;align-items:center}
.guide>summary::-webkit-details-marker{display:none}
.guide>summary::after{content:"Hide";font:500 12px var(--mono);color:var(--muted)}
.guide:not([open])>summary::after{content:"Show"}
.guide .cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding:2px 18px 18px}
.guide .cols3 b{display:block;font:700 13px var(--display);margin-bottom:4px}
.guide .cols3 p{margin:0;font-size:13.5px;color:var(--ink2)}
@media(max-width:760px){.guide .cols3{grid-template-columns:1fr}}
.pats{display:grid;gap:10px}
.pat{border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.pat>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:44px minmax(0,1fr) 210px;gap:14px;align-items:center;padding:16px 18px}
.pat>summary::-webkit-details-marker{display:none}
.pat[open]>summary{border-bottom:1px solid var(--line2)}
.rank{font:700 30px/1 var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.ptitle{display:flex;align-items:center;gap:10px;font:700 17px/1.25 var(--display);letter-spacing:-.01em}
.sw{width:12px;height:12px;border-radius:3px;flex:none}
.psum{margin:4px 0 0;font-size:13.5px;color:var(--ink2);max-width:64ch}
.pstat{display:grid;gap:6px;font-size:12.5px;color:var(--ink2)}
.pstat .bar2{height:8px;border-radius:4px;background:var(--line2);overflow:hidden}
.pstat .bar2 i{display:block;height:100%;border-radius:4px}
.pstat .nums{display:flex;gap:12px;font-variant-numeric:tabular-nums}.pstat .nums b{color:var(--ink);font:600 13px var(--body)}
@media(max-width:820px){.pat>summary{grid-template-columns:34px minmax(0,1fr)}.pstat{grid-column:2}}
.pbody2{padding:16px 18px 18px;display:grid;gap:18px}
.pbody2 h4{margin:0 0 8px;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ex{display:grid;gap:10px}
.ex .e{display:grid;grid-template-columns:132px minmax(0,1fr);gap:4px 14px;font-size:13.5px;padding:10px 0;border-top:1px solid var(--line2)}
.ex .e:first-child{border-top:0;padding-top:0}
.ex .meta{font:500 11.5px var(--mono);color:var(--muted);line-height:1.5}
.ex q{display:block;font:400 13px var(--mono);color:var(--ink);background:var(--bg);border-radius:5px;padding:3px 8px;margin-top:5px;quotes:none;width:fit-content;max-width:100%;overflow-wrap:anywhere}
@media(max-width:620px){.ex .e{grid-template-columns:1fr}}
.fixbox{border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:12px;background:var(--bg)}
.tag{display:inline-block;font:600 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:var(--brand-soft);color:var(--brand)}
.tag.warn{background:var(--nf-bg);color:var(--nf)}.tag.mute{background:var(--na-bg);color:var(--na)}
.change{font:400 13px/1.6 var(--mono);white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.kv2{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 14px;font-size:13.5px}
.kv2 dt{color:var(--muted)}.kv2 dd{margin:0}
@media(max-width:620px){.kv2{grid-template-columns:1fr}}
.callout{border-left:3px solid var(--nf);background:var(--nf-bg);color:var(--ink);padding:9px 12px;border-radius:0 6px 6px 0;font-size:13.5px}
.callout.ok{border-color:var(--brand);background:var(--brand-soft)}
.fixfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chart{display:grid;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.legend{display:flex;gap:18px;font-size:12.5px;color:var(--ink2);align-items:center;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.crow{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 34px;gap:12px;align-items:center;padding:3px 0;font-size:13px;border-radius:4px}
.crow:hover{background:var(--bg)}
.crow .trk{display:flex;gap:2px;height:12px}
.crow .trk i{display:block;height:100%;border-radius:0 4px 4px 0}
.crow .trk i:first-child{border-radius:2px 4px 4px 2px}
.crow .tot{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--line2);text-align:left}.tbl th{color:var(--muted);font:600 11px var(--mono);text-transform:uppercase}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:6px 10px;border-radius:6px;opacity:0;transition:opacity .08s;max-width:260px}
.trust{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.trust{grid-template-columns:1fr}}
.tbox{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:18px;display:grid;gap:10px;align-content:start}
.tbox h3{margin:0;font:700 15px var(--display)}
.big2{font:700 34px/1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big2 small{font:500 13px var(--body);color:var(--muted);letter-spacing:0;margin-left:6px}
.rowlist{display:grid;gap:6px;font-size:13.5px}.rowlist div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line2);padding-bottom:5px}
.rowlist b{font-variant-numeric:tabular-nums}
.gloss{display:grid;grid-template-columns:repeat(2,1fr);gap:0 36px}
.gloss dl{margin:0;display:grid;gap:12px}
.gloss dt{font:700 14px var(--display)}.gloss dd{margin:2px 0 0;font-size:13.5px;color:var(--ink2)}
@media(max-width:760px){.gloss{grid-template-columns:1fr}}
.linkbtn{color:var(--brand);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;background:none;border:0;padding:0;font:inherit}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}


.livebar{display:grid;gap:12px}
.liverow{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:0;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.liverow>div{padding:14px 16px;border-right:1px solid var(--line);min-width:0}
.liverow b{display:block;font:700 26px/1.1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.liverow span{font-size:12.5px;color:var(--muted)}
.liverow .act{display:grid;align-content:center;gap:6px;border-right:0;min-width:190px}
@media(max-width:860px){.liverow{grid-template-columns:1fr 1fr}.liverow>div{border-bottom:1px solid var(--line)}.liverow .act{grid-column:1/-1}}
.rcalls{display:grid;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.rcall{display:grid;grid-template-columns:minmax(120px,220px) auto minmax(0,1fr);gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line2);text-decoration:none;color:inherit;font-size:13.5px}
.rcall:first-child{border-top:0}.rcall:hover{background:var(--bg)}
.rcall .fn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips2{display:flex;flex-wrap:wrap;gap:6px}
.chip2{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line2);color:var(--ink2)}
.chip2 i{width:8px;height:8px;border-radius:2px;display:inline-block}
.newchip{font:600 11px var(--mono);color:var(--brand);background:var(--brand-soft);padding:1px 7px;border-radius:4px}
@media(max-width:700px){.rcall{grid-template-columns:1fr auto}.rcall .chips2{grid-column:1/-1}}


.rv{border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.rv+.rv{margin-top:10px}
.rv>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:14px 18px}
.rv>summary::-webkit-details-marker{display:none}
.rv[open]>summary{border-bottom:1px solid var(--line2)}
.rv .nm{font:700 15px var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rvbody{padding:16px 18px 18px;display:grid;gap:18px}
.rvbody h4{margin:0 0 8px;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rvflags{margin:0;padding-left:18px;font-size:13px;color:var(--ink2)}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;background:var(--panel)}
.radios input{accent-color:var(--brand)}
.radios label:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.rvrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:8px 16px;align-items:start;padding:10px 0;border-top:1px solid var(--line2)}
.rvrow:first-of-type{border-top:0}
.rvrow .pn{font-weight:600;font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rvrow .why{font-size:13px;color:var(--ink2);margin-top:4px}.rvrow .ev2{font:400 12px var(--mono);color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
@media(max-width:760px){.rvrow{grid-template-columns:1fr}}
.sel,.inp{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:var(--panel);color:var(--ink);width:100%}
.sel:focus-visible,.inp:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.addrow{display:grid;grid-template-columns:1.2fr .8fr 1.4fr 1.4fr auto;gap:8px;align-items:center}
@media(max-width:900px){.addrow{grid-template-columns:1fr 1fr}}
.addedlist{display:grid;gap:6px;margin-bottom:8px}.addedl{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13px;background:var(--bg);border-radius:6px;padding:6px 10px}
.rvfoot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;border-top:1px solid var(--line2);padding-top:14px}
.rvfoot .l{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.badge{margin-left:auto;font:600 11px var(--mono);background:var(--nf-bg);color:var(--nf);border-radius:99px;padding:1px 8px}
.ok-msg{font-size:13px;color:var(--pass);font-weight:600}


.fx{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:1000px){.fx{grid-template-columns:1fr}}
.fxlist{display:grid;gap:8px;position:sticky;top:16px}
@media(max-width:1000px){.fxlist{position:static}}
.fxitem{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px 14px;cursor:pointer;display:grid;gap:8px;text-align:left;font:inherit;color:inherit}
.fxitem:hover{border-color:var(--muted)}.fxitem.sel{border-color:var(--brand);background:var(--brand-soft)}
.fxitem b{font:700 14px/1.3 var(--display)}
.pips{display:flex;gap:6px;align-items:center;font:500 11px var(--mono);color:var(--muted)}
.pip{width:22px;height:6px;border-radius:3px;background:var(--line)}.pip.on{background:var(--pass)}.pip.mid{background:var(--nf)}.pip.na{background:repeating-linear-gradient(90deg,var(--line) 0 3px,transparent 3px 6px)}
.step{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:18px 20px;display:grid;gap:14px}
.step+.step{margin-top:12px}
.step>h3{margin:0;font:700 17px var(--display);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sn{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--mono);background:var(--na-bg);color:var(--ink2)}
.sn.done{background:var(--pass);color:#fff}.sn.mid{background:var(--nf);color:#fff}
.diff{font:400 12.5px/1.6 var(--mono);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.diff div{padding:2px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.diff .ctx{color:var(--muted);background:var(--bg)}.diff .add{background:var(--pass-bg);color:var(--ink)}
.diff .add::before{content:"+ ";color:var(--pass);font-weight:700}
.scripts{display:grid;gap:6px}
.script{border:1px solid var(--line2);border-radius:8px;padding:8px 12px;font-size:13px}
.script summary{cursor:pointer;display:flex;gap:10px;align-items:center;flex-wrap:wrap;list-style:none}
.script summary::-webkit-details-marker{display:none}
.script ol{margin:8px 0 0;padding-left:20px;color:var(--ink2)}
.matrix{width:100%;border-collapse:collapse;font-size:13px}
.matrix th{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.matrix td{padding:8px;border-bottom:1px solid var(--line2);vertical-align:middle}
.cellbtn{border:1px dashed var(--line);border-radius:7px;background:none;padding:4px 10px;font:600 12px var(--body);color:var(--brand);cursor:pointer}
.cellbtn:hover{border-color:var(--brand)}
.runform{display:grid;gap:8px;border:1px solid var(--brand);border-radius:8px;padding:12px;background:var(--bg);margin-top:8px}
.runform textarea{min-height:130px;font:400 13px/1.5 var(--mono)}
.tl{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}.tl b{color:var(--ink);font-variant-numeric:tabular-nums}
.how{font-size:13px;color:var(--ink2);background:var(--bg);border-radius:8px;padding:10px 14px}
.how ol{margin:6px 0 0;padding-left:18px}


/* ---------- review focus view ---------- */
.rvhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.rvbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.rvbar .nm2{font:700 15px var(--display);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.nav2{display:flex;gap:6px;align-items:center;font:600 12.5px var(--mono);color:var(--muted)}
.nav2 button{border:1px solid var(--line);background:var(--panel);border-radius:7px;width:30px;height:30px;font-size:15px;color:var(--ink);cursor:pointer}
.nav2 button:disabled{opacity:.4;cursor:default}
.rvwrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:1000px){.rvwrap{grid-template-columns:1fr}}
.rvleft{position:sticky;top:12px;display:grid;gap:10px}
@media(max-width:1000px){.rvleft{position:static}}
.rvtx{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;max-height:62vh;overflow:auto;padding:6px}
.tl{display:grid;grid-template-columns:40px 46px minmax(0,1fr) auto;gap:8px;align-items:start;padding:6px 8px;border-radius:7px;font-size:13.5px;cursor:default}
.tl.seek{cursor:pointer}.tl.seek:hover{background:var(--bg)}
.tl .tt{font:500 11.5px var(--mono);color:var(--muted);padding-top:2px}
.tl .who{font:600 11.5px var(--mono);color:var(--muted);padding-top:2px}
.tl.bot .who{color:var(--brand)}
.tl.hl{background:var(--nf-bg)}
.tl.live{outline:2px solid var(--brand);outline-offset:-2px}
.marks{display:flex;gap:4px}
.mk{min-width:20px;height:20px;border-radius:10px;background:var(--fatal);color:#fff;font:700 11px var(--mono);display:grid;place-items:center;padding:0 5px}
.mk.nf{background:var(--nf)}
.recbox{background:var(--brand-soft);border-radius:8px;padding:8px 12px;font-size:13px}
.recbox b{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.05em;margin-right:8px;color:var(--brand)}
.rvright{display:grid;gap:14px}
.rvright h3{margin:0;font:700 15px var(--display)}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.pc.no{opacity:.75}
.pch{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pch b{font-size:14px}
.pcw{font-size:13.5px;color:var(--ink2)}
.pce{font:400 12px/1.5 var(--mono);color:var(--muted);border-left:2px solid var(--line);padding-left:8px;overflow-wrap:anywhere}
.hear{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:2px 9px;font:600 12px var(--body);color:var(--brand);cursor:pointer;margin-left:auto}
.hear:hover{border-color:var(--brand)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg2 button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;font:600 13px var(--body);color:var(--ink2);cursor:pointer}
.seg2 button.on.yes{background:var(--fatal-bg);border-color:var(--fatal);color:var(--fatal)}
.seg2 button.on.no{background:var(--na-bg);border-color:var(--muted);color:var(--ink)}
.rchips{display:flex;gap:6px;flex-wrap:wrap}
.rchips button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:3px 11px;font:500 12.5px var(--body);cursor:pointer;color:var(--ink2)}
.rchips button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}
.pc details summary{cursor:pointer;color:var(--muted);font-size:12.5px}
.moreb{display:grid;gap:8px;margin-top:8px}
.rvsave{position:sticky;bottom:0;background:var(--bg);padding:10px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line)}
.toast{background:var(--pass-bg);color:var(--pass);font-weight:600;border-radius:8px;padding:8px 14px}

.err-msg{color:var(--fatal);font-size:12px;margin-top:6px}
main{padding:26px clamp(16px,3vw,40px) 60px;min-width:0;max-width:1680px;width:100%}
/* ---------- primitives ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:18px 20px}
.card+.card,.stack>*+*{margin-top:16px}
.card h3{margin:0 0 12px;font:700 15px/1.3 var(--display);letter-spacing:-.005em}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:650;white-space:nowrap;line-height:1.6}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.pill.Pass,.verdict.Pass{background:var(--pass-bg);color:var(--pass)}.pill.Non-Fatal,.verdict.Non-Fatal{background:var(--nf-bg);color:var(--nf)}
.pill.Fatal,.verdict.Fatal{background:var(--fatal-bg);color:var(--fatal)}.pill.NA,.pill.run{background:var(--na-bg);color:var(--na)}
.brand-pill{background:var(--brand-soft);color:var(--brand)}
.muted{color:var(--muted)}.sm{font-size:12.5px}
.sp{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:r .8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes r{to{transform:rotate(360deg)}}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:9px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.primary:hover{filter:brightness(1.08);color:var(--brand-ink)}
.btn:disabled{opacity:.55;cursor:default}
a.btn{text-decoration:none;display:inline-block}
.btn.tiny{padding:3px 9px;font-size:12px;font-weight:600}
/* ---------- job header ---------- */
.hero{display:grid;gap:14px}
.hero h2{margin:0;font:700 22px/1.2 var(--display);letter-spacing:-.01em;overflow-wrap:anywhere}
.verdict{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 12px;border-radius:12px;font:700 18px/1.2 var(--display)}
.verdict small{display:block;font-size:11px;font-weight:600;opacity:.75;text-transform:uppercase;letter-spacing:.06em}
.verdict .dot{width:12px;height:12px;border-radius:50%;background:currentColor}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--panel)}
.tile b{font:700 26px/1.1 var(--display);display:block;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.tile.f b{color:var(--fatal)}.tile.n b{color:var(--nf)}.tile.p b{color:var(--pass)}.tile.r b{color:var(--brand)}
audio{width:100%;height:38px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:22px 0 16px}
.tab{background:none;border:0;padding:9px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}.tab.on{color:var(--brand);border-color:var(--brand)}
.tab em{font-style:normal;background:var(--na-bg);color:var(--muted);border-radius:99px;padding:0 7px;margin-left:6px;font-size:11px}
/* ---------- alerts ---------- */
.alert{border-radius:12px;padding:12px 16px;background:var(--nf-bg);color:var(--nf);display:flex;gap:12px}
.alert.bad{background:var(--fatal-bg);color:var(--fatal)}.alert.good{background:var(--pass-bg);color:var(--pass)}
.alert ul{margin:4px 0 0;padding-left:18px}.alert b{display:block}
/* ---------- compare ---------- */
.cmp{display:grid;grid-template-columns:130px 1fr 1fr;gap:0;font-size:13.5px}
.cmp>div{padding:8px 10px;border-bottom:1px solid var(--line2)}
.cmp .h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.cmp .k{color:var(--muted)}
@media(max-width:640px){.cmp{grid-template-columns:100px 1fr 1fr}}
/* ---------- audit table ---------- */
.grp{margin-top:6px}
.grp h4{margin:14px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.prow{border:1px solid var(--line);border-left-width:4px;border-radius:10px;margin-bottom:6px;background:var(--panel)}
.prow.Fatal{border-left-color:var(--fatal)}.prow.Non-Fatal{border-left-color:#e9a23b}.prow.Pass{border-left-color:var(--pass)}.prow.NA{border-left-color:#c8cdd8}
.prow.Fatal{background:linear-gradient(90deg,var(--fatal-bg),var(--panel) 30%)}
.prow.Non-Fatal{background:linear-gradient(90deg,var(--nf-bg),var(--panel) 30%)}
.prow summary{list-style:none;display:grid;grid-template-columns:minmax(160px,1fr) 96px 168px minmax(0,2fr);gap:12px;align-items:center;padding:9px 12px;cursor:pointer}
.prow summary::-webkit-details-marker{display:none}
.prow .nm{font-weight:600}.prow summary .pill{justify-self:start}.prow summary>span:nth-child(3){white-space:nowrap}
.prow .ev{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow.NA .nm{color:var(--muted);font-weight:500}
@media(max-width:700px){.prow summary{grid-template-columns:1fr auto}.prow .ev{display:none}}
.pbody{padding:2px 14px 12px;font-size:13px;color:var(--ink2);display:grid;gap:4px}
.pbody b{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--brand-soft);color:var(--brand)}
.agree{height:8px;border-radius:99px;background:var(--fatal-bg);overflow:hidden;margin:8px 0 6px}
.agree i{display:block;height:100%;background:var(--pass);border-radius:99px}
/* ---------- transcript ---------- */
.tx{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:10px;max-width:88%}
.msg.buyer{align-self:flex-end;flex-direction:row-reverse}
.av{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--brand-soft);color:var(--brand)}
.msg.buyer .av{background:var(--pass-bg);color:var(--pass)}
.bub{padding:8px 12px;border-radius:12px;background:var(--bot);font-size:14px}
.msg.buyer .bub{background:var(--buyer)}
.bub small{display:block;color:var(--muted);font-size:11px;margin-bottom:1px}
.gap{align-self:center;font-size:12px;color:var(--nf);background:var(--nf-bg);padding:3px 12px;border-radius:99px}
/* ---------- fixes / layer 2 ---------- */
.issue{padding:0;overflow:hidden}
.ihead{padding:16px 20px;display:grid;gap:6px}
.ihead .t{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ihead .t b{font-size:15px}
.patch{padding-right:70px!important;margin:10px 0 0;background:#0f1320;color:#e6e9f5;border-radius:10px;padding:12px 14px;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;position:relative}
.patch .cp{position:absolute;top:8px;right:8px;background:#232a40;color:#e6e9f5;border-color:#3a4263}
.l2{border-top:1px solid var(--line);padding:16px 20px;background:var(--bg)}
.l2 h5{margin:0 0 4px;font-size:13px}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .4s}
.verdict-banner{border-radius:12px;padding:14px 16px;margin:12px 0;display:flex;gap:12px;align-items:flex-start}
.verdict-banner b{font-size:15px;display:block;text-transform:capitalize}
.vb-improved{background:var(--pass-bg);color:var(--pass)}.vb-inconclusive,.vb-incomplete,.vb-no-change{background:var(--na-bg);color:var(--ink2)}
.vb-worse,.vb-regression,.vb-error{background:var(--fatal-bg);color:var(--fatal)}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:760px){.metrics{grid-template-columns:1fr}}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.metric h6{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:72px 1fr 38px;gap:8px;align-items:center;font-size:12.5px}
.bar .tr{height:10px;background:var(--line2);border-radius:99px;overflow:hidden;position:relative}
.bar .tr i{display:block;height:100%;border-radius:99px}
.bar.base i{background:#e08a8f}.bar.pat i{background:var(--brand)}.bar.ok i{background:var(--pass)}
.gauge{position:relative}
.gauge .tr{height:12px}.gauge .th{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.runs{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.runs th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.runs td{padding:7px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
.convo{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0 10px}
.convo .tx{max-height:340px;overflow:auto}
details.persona summary,details.runsd summary{cursor:pointer;color:var(--brand);font-weight:600;font-size:13px}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}
.empty{text-align:center;padding:48px 20px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px;text-align:left}
@media(max-width:700px){.steps{grid-template-columns:1fr}}
.steps div{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg)}
.steps b{display:block;margin-bottom:2px}
.stepn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font-size:12px;font-weight:700;margin-bottom:8px}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
  <div class="brand"><div class="logo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 12v0M8 8v8M12 4v16M16 8v8M20 12v0"/></svg></div><div>Vani Call Audit<span class="sub">self-auditing voice bot</span></div></div>
  <nav class="nav" aria-label="Sections">
    <button class="navbtn" id="navov"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 12h10M4 19h6"/></svg>Overview</button>
    <button class="navbtn" id="navrv"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"/></svg>Review queue<span class="badge" id="rvbadge" hidden></span></button>
    <button class="navbtn" id="navfx"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6l4 4M4 20l1-4L16 5l3 3L8 19l-4 1z"/></svg>Fixes</button>
    <button class="navbtn" id="navaudit"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12v0M9 8v8M13 5v14M17 9v6M21 12v0"/></svg>Audit a call</button>
    
  </nav>
  <div id="auditpane" hidden>
  <div>
    <p class="label">New audit</p>
    <div class="drop" id="drop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L7 9m5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg><b>Drop a call recording</b><span class="sm">or click to browse · mp3, wav, m4a</span></div>
    <input type="file" id="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.opus,.flac,.amr" hidden>
    
    <div id="samples"></div>
    <details class="paste"><summary>Or paste a chat transcript</summary>
      <input id="tname" class="field" placeholder="Name, e.g. patched run 1">
      <textarea id="ttext" class="field" rows="6" placeholder="Vani: हेलो, आपको ...&#10;Buyer: हाँ जी&#10;Vani: ..."></textarea>
      <button class="btn primary" id="tgo" style="width:100%">Audit transcript</button>
    </details>
    <div id="uploaderr" class="err-msg"></div>
  </div>
  <div><p class="label">Recent audits</p><div class="jobs" id="jobs"></div><div class="sm muted" id="nojobs">No audits yet.</div></div>
  </div>
</aside>
<main id="main"></main>
<div id="tip" role="tooltip"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pill=(v,label)=>`<span class="pill ${esc(v)}"><i></i>${esc(label||v)}</span>`;
const ui={tab:new URLSearchParams(location.search).get("tab")||"audit",filter:"all",open:{},runs:2,job:null,last:""};
let current=location.hash.slice(1)||null,timer=null,viewSeq=0;
$("#navaudit").onclick=()=>{location.hash="audits"};
$("#navov").onclick=()=>{location.hash="overview"};
$("#navrv").onclick=()=>{location.hash="review"};
$("#navfx").onclick=()=>{location.hash="fixes"};

async function api(path,opt){const r=await fetch(path,opt);const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j}
function go(id){current=id;location.hash=id||"audits";ui.tab="audit";ui.last="";poll()}

/* ---------- sidebar ---------- */
async function upload(f){$("#uploaderr").textContent="";try{const j=await api("/api/audit?name="+encodeURIComponent(f.name),{method:"POST",body:f});go(j.id)}catch(e){$("#uploaderr").textContent=e.message}}
$("#tgo").onclick=async()=>{$("#uploaderr").textContent="";try{const j=await api("/api/transcript",{method:"POST",body:JSON.stringify({name:$("#tname").value,text:$("#ttext").value})});go(j.id)}catch(e){$("#uploaderr").textContent=e.message}};
const drop=$("#drop"),fi=$("#file");
drop.onclick=()=>fi.click();fi.onchange=()=>fi.files[0]&&upload(fi.files[0]);
drop.ondragover=e=>{e.preventDefault();drop.classList.add("over")};drop.ondragleave=()=>drop.classList.remove("over");
drop.ondrop=e=>{e.preventDefault();drop.classList.remove("over");e.dataTransfer.files[0]&&upload(e.dataTransfer.files[0])};
async function loadSamples(){
  const s=await api("/api/samples");
  $("#samples").innerHTML=s.length?`<div class="sm muted" style="margin-top:12px">Audited samples</div><div class="chips">${s.map(n=>`<button class="sbtn" data-s="${esc(n)}">${esc(n.replace(".mp3",""))}</button>`).join("")}</div>`:"";
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=async()=>go((await api("/api/sample",{method:"POST",body:JSON.stringify({name:b.dataset.s})})).id));
}
const ago=t=>{const s=Date.now()/1000-t;return s<90?"just now":s<5400?Math.round(s/60)+" min ago":s<129600?Math.round(s/3600)+" h ago":Math.round(s/86400)+" d ago"};
async function loadJobs(){
  const js=await api("/api/jobs");$("#nojobs").style.display=js.length?"none":"";
  $("#jobs").innerHTML=js.map(j=>`<div class="job ${j.id===current?"sel":""}" data-id="${j.id}"><div class="row"><span class="fn" title="${esc(j.filename)}">${esc(j.filename)}</span>${j.overall?pill(j.overall):pill(j.status==="error"?"Fatal":"run",j.status==="error"?"Error":"Running")}</div><div class="when">${ago(j.created)}${j.flagged?" · ⚑ needs review":""}</div></div>`).join("");
  document.querySelectorAll(".job").forEach(el=>el.onclick=()=>go(el.dataset.id));
}

/* ---------- polling ---------- */
async function poll(){
  clearTimeout(timer);loadJobs();const tok=++viewSeq;
  const view=current==="review"?"review":current==="fixes"?"fixes":(!current||current==="overview")?"overview":current==="audits"?"audits":"job";
  api("/api/live").then(L=>{const b=$("#rvbadge");b.hidden=!L.to_review;b.textContent=L.to_review}).catch(()=>{});
  $("#navrv").classList.toggle("on",view==="review");$("#navfx").classList.toggle("on",view==="fixes");
  $("#navov").classList.toggle("on",view==="overview");$("#navaudit").classList.toggle("on",view==="audits"||view==="job");
  $("#auditpane").hidden=!(view==="audits"||view==="job");
  const mm=$("#main");if(mm.dataset.shown!==view){mm.dataset.shown=view;ui.lastov="";ui.last="";}
  if(view==="review"){renderReview();return}
  if(view==="fixes"){renderFixes();return}
  if(view==="overview"){renderOverview();timer=setTimeout(poll,6000);return}
  if(view==="audits"){empty();return}
  let j;try{j=await api("/api/job/"+current)}catch(e){if(tok===viewSeq)$("#main").innerHTML=`<div class="card">${esc(e.message)}</div>`;return}
  if(tok!==viewSeq)return;
  const sig=JSON.stringify(j)+ui.tab+ui.filter+ui.runs;
  if(sig!==ui.last){ui.last=sig;ui.job=j;render(j)}
  const testing=Object.values(j.tests||{}).some(t=>t.status==="running"||(t.result&&(t.result.cells||[]).some(c=>c.rendering)));
  if(!["done","error"].includes(j.status)||testing)timer=setTimeout(poll,1800);
}
function empty(){$("#main").innerHTML=`<div class="card empty"><h2 style="margin:0 0 6px;font-size:20px">Audit a Vani call in a minute</h2><div class="muted">Grades every call against the quality rubric, explains the failures, proposes prompt fixes and tests them with simulated buyers.</div>
<div class="steps"><div><span class="stepn">1</span><b>Upload</b><span class="sm muted">Drop a recording. It is transcribed with bot and buyer separated.</span></div><div><span class="stepn">2</span><b>Audit</b><span class="sm muted">Each rubric parameter gets Pass, Non-Fatal or Fatal with quoted evidence; uncertain calls go to a human queue.</span></div><div><span class="stepn">3</span><b>Fix and test</b><span class="sm muted">Get a prompt patch per root cause, then test it against simulated buyers before shipping.</span></div></div></div>`}

/* ---------- render ---------- */
const STEP={queued:"Queued",transcribe:"Transcribing and separating bot / buyer speech (30-60 s)",judge:"Auditing against the rubric with two independent judge runs",suggest:"Working out root causes and prompt fixes"};
const GROUPS=[["Intent",["Outcome Accuracy"]],["Quantity",["Quantity Accuracy","Quantity Unit Accuracy","Quantity Probing Error","Qty Missed Opportunity"]],["Specifications",["Spec1 Accuracy","Spec2 Accuracy","Spec Missed Opportunity"]],["Conversation quality",["Looping Behavior","Dead air","WER"]],["Capture and routing",["Additional Details","Product Change Accuracy","Category ISQ Error","MCAT Search Error","OnCall AstBuy Error"]]];

function render(j){
  const m=$("#main");
  if(j.status==="error"){m.innerHTML=`<div class="card"><h2 style="margin:0 0 8px">${esc(j.filename)}</h2><div class="alert bad"><div><b>This audit failed</b>${esc(j.error||j.message)}</div></div></div>`;return}
  if(j.status!=="done"){m.innerHTML=`<div class="card hero"><h2>${esc(j.filename)}</h2><div><span class="spin"></span>${esc(STEP[j.status]||j.message)}</div><div class="note">Keep this page open, it updates itself.</div></div>`;return}
  const r=j.report,cnt=v=>r.rows.filter(x=>x.verdict===v).length,issues=j.issues||[];
  const col={Fatal:"Fatal",Pass:"Pass","Non-Fatal":"Non-Fatal"}[r.overall];
  let h=`<div class="card hero"><div class="sp"><div><h2>${esc(j.filename)}</h2><div class="sm muted">${r.transcript.length} speech segments · ${esc(r.source)}</div></div>
    <div class="verdict ${col}"><span class="dot"></span><div><small>Overall</small>${esc(r.overall)}</div></div></div>
    ${j.audio?`<audio controls preload="none" src="/api/audio/${j.id}/${esc(j.audio)}"></audio>`:`<div class="note">Pasted transcript: no audio, so dead air and pronunciation are not assessed.</div>`}
    <div class="tiles"><div class="tile f"><b>${cnt("Fatal")}</b><span>Fatal</span></div><div class="tile n"><b>${cnt("Non-Fatal")}</b><span>Non-Fatal</span></div><div class="tile p"><b>${cnt("Pass")}</b><span>Pass</span></div><div class="tile r"><b>${r.risk.reasons.length}</b><span>Review flags</span></div></div></div>
    <div class="tabs">${[["audit","Audit"],["tx","Transcript"],["fix","Fixes and tests"]].map(([k,t])=>`<button class="tab ${ui.tab===k?"on":""}" data-tab="${k}">${t}${k==="fix"?`<em>${issues.length}</em>`:""}</button>`).join("")}</div>`;
  h+=ui.tab==="audit"?auditTab(j):ui.tab==="tx"?txTab(r):fixTab(j);
  m.innerHTML=h;wire(j);
}

function auditTab(j){
  const r=j.report,hu=j.human,hm={};if(hu)hu.rows.forEach(x=>hm[x.parameter]=x);
  const by={};r.rows.forEach(x=>by[x.parameter]=x);
  let h="";
  if(r.incomplete)h+=`<div class="alert bad"><div><b>This audit is incomplete</b>The judge answered too few checks, so no verdict is shown and the call is left out of the dashboard totals. <button class="btn" id="reaudit" style="margin-left:8px">Run the audit again</button></div></div>`;
  h+=r.risk.flag?`<div class="alert"><div><b>⚑ Human review queue</b><ul>${r.risk.reasons.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div>`:`<div class="alert good"><div><b>No risk flags</b>Auto-graded with confidence; no human review needed.</div></div>`;
  if(hu){const pc=Math.round(hu.agree/hu.total*100);h+=`<div class="card" style="margin-top:16px"><div class="sp"><h3 style="margin:0">Agreement with the human audit</h3><span class="sm muted">offer ${esc(hu.offer_id)}</span></div>
    <div class="agree"><i style="width:${pc}%"></i></div><div class="sm"><b>${hu.agree} of ${hu.total}</b> parameters agree (${pc}%) · human overall ${pill(hu.human_overall)} · agent overall ${pill(r.overall)}</div>${hu.human_remarks?`<div class="note" style="margin-top:6px">Auditor remark: ${esc(hu.human_remarks)}</div>`:""}</div>`}
  const f=r.facts;
  h+=`<div class="card" style="margin-top:16px"><h3>What the buyer said vs what Vani captured</h3><div class="cmp"><div class="h"></div><div class="h">Buyer said</div><div class="h">Vani captured</div>
    <div class="k">Product</div><div>${esc(f.buyer_product)}</div><div></div>
    <div class="k">Quantity</div><div>${esc(f.buyer_quantity_and_unit)}</div><div>${esc(f.bot_quantity_captured)}</div>
    <div class="k">Specs</div><div>${esc(f.buyer_specs_stated)}</div><div>${esc(f.bot_specs_captured)}</div></div>
    ${r.recorded_values_used?`<div class="note" style="margin-top:10px"><b>Compared with the values the bot recorded for this call.</b></div>`:""}
    ${r.observation?`<div class="note" style="margin-top:10px"><b>Observation:</b> ${esc(r.observation)}</div>`:""}</div>`;
  h+=`<div class="card" style="margin-top:16px"><div class="sp"><h3 style="margin:0">Rubric audit</h3><div class="seg"><button data-filter="all" class="${ui.filter==="all"?"on":""}">All</button><button data-filter="issues" class="${ui.filter==="issues"?"on":""}">Issues only</button></div></div>`;
  GROUPS.forEach(([g,ps])=>{
    const rows=ps.map(p=>by[p]).filter(x=>x&&(ui.filter==="all"||x.verdict==="Fatal"||x.verdict==="Non-Fatal"));
    if(!rows.length)return;
    h+=`<div class="grp"><h4>${g}</h4>`+rows.map(x=>{const hv=hm[x.parameter],key="p:"+x.parameter;
      return `<details class="prow ${x.verdict}" data-key="${key}" ${ui.open[key]?"open":""}><summary><span class="nm">${esc(x.parameter)}</span>${pill(x.verdict)}<span>${hv?(hv.match?`<span class="sm muted">human: ${esc(hv.human)} ✓</span>`:`<span class="sm" style="color:var(--nf)">human: ${esc(hv.human)}</span>`):""}${x.disputed?` <span title="the two judge runs disagreed" class="sm" style="color:var(--nf)">⚑ disputed</span>`:""}</span><span class="ev">${esc(x.evidence)}</span></summary>
      <div class="pbody"><div><b>Rule</b><br>${esc(x.rule)}</div>${x.evidence?`<div><b>Evidence</b><br>${esc(x.evidence)}</div>`:""}${x.reason&&x.verdict!=="NA"?`<div><b>Why</b><br>${esc(x.reason)}</div>`:""}${x.verdict!=="NA"?`<div class="note">Confidence: ${esc(x.confidence)}</div>`:""}</div></details>`}).join("")+`</div>`;
  });
  h+=`<div class="note" style="margin-top:12px">Severity is decided in code from the rubric table; the model only reports facts. Pronunciation, MCAT search and seller-pitch status cannot be fully judged from text.</div></div>`;
  return h;
}

function txTab(r){
  const items=r.transcript.map(e=>({t:e.start_time_seconds,h:bubble(String(e.speaker_id)==="0"?"bot":"buyer",e.transcript,e.start_time_seconds)}));
  (r.dead_air_gaps||[]).forEach(g=>items.push({t:g.from+.01,h:`<div class="gap">${g.seconds}s silence ${g.after_handover?"after handover to seller (not counted)":"counted as dead air"}</div>`}));
  return `<div class="card"><div class="tx">${items.sort((a,b)=>a.t-b.t).map(x=>x.h).join("")}</div></div>`;
}
const bubble=(w,t,s)=>`<div class="msg ${w}"><div class="av">${w==="bot"?"V":"B"}</div><div class="bub">${s!=null?`<small>${w==="bot"?"Vani":"Buyer"} · ${(+s).toFixed(1)}s</small>`:`<small>${w==="bot"?"Vani":"Buyer"}</small>`}${esc(t)}</div></div>`;

function fixTab(j){
  const iss=j.issues||[];
  if(j.suggest_error)return `<div class="alert bad"><div><b>Fix suggestion failed</b>${esc(j.suggest_error)}</div></div>`;
  if(!iss.length)return `<div class="card"><b>Nothing to fix.</b><div class="muted">No failed checks in this call.</div></div>`;
  const ctrl=(j.tests&&Object.values(j.tests).find(t=>t.control_names!=null));
  return `<div class="stack">`+iss.map((is,i)=>{
    const t=(j.tests||{})[i],noPatch=is.proposed_patch.startsWith("NO PROMPT PATCH");
    return `<div class="card issue"><div class="ihead"><div class="t"><b>${esc(is.parameter)}</b><span class="pill NA">${esc(is.layer.replace("_"," "))}</span></div>
      <div>${esc(is.root_cause)}</div><div class="sm muted">${noPatch?"Recommended action":"Proposed prompt patch"} · ${esc(is.patch_location)}</div>
      <div class="patch"><button class="btn tiny cp" data-copy="${i}">Copy</button>${esc(is.proposed_patch)}</div>
      <details class="persona" data-key="s:${i}" ${ui.open["s:"+i]?"open":""} style="margin-top:6px"><summary>Test scenario</summary><div class="sm" style="margin-top:6px"><b>Buyer to simulate:</b> ${esc(is.buyer_persona)}<br><b>Correct behaviour:</b> ${esc(is.expected_behaviour)}</div></details></div>
      <div class="l2">${noPatch?`<div class="note">This is not a prompt issue, so there is nothing to test by simulation. Pass it to the team named above.</div>`:l2(j,i,t)}</div></div>`}).join("")+`</div>`;
}

function l2(j,i,t){
  if(t&&t.status==="running"){const pc=t.total?Math.round(t.done/t.total*100):4;return `<h5>Layer 2 test running</h5><div class="prog"><i style="width:${pc}%"></i></div><div class="sm"><span class="spin"></span>${esc(t.message)}</div>`}
  let h="";
  if(t&&t.status==="error")h+=`<div class="alert bad" style="margin-bottom:10px"><div><b>Test failed</b>${esc(t.message)}</div></div>`;
  h+=`<div class="sp"><div><h5>Layer 2 · simulated buyers</h5><div class="note">Replays this buyer (3 styles) against the current prompt and the patched prompt, audits every call with the same rubric, and checks the simulator reproduces the original failure before trusting the result.</div></div>
    <div style="display:flex;gap:8px;align-items:center"><span class="sm muted">Runs per cell</span><div class="seg">${[1,2,3].map(n=>`<button data-runs="${n}" class="${ui.runs===n?"on":""}">${n}</button>`).join("")}</div><button class="btn primary" data-test="${i}">${t&&t.result?"Re-run":"Run"} test</button></div></div>`;
  if(t&&t.status==="done"){
    if(!t.result.cells)return h+`<div class="note" style="margin-top:10px">This result is from an older test format. Re-run to get the Layer 2 analysis.</div>`;
    h+=resultHtml(j.id,i,t)}
  return h;
}

function bar(label,n,total,cls){const p=total?Math.round(n/total*100):0;return `<div class="bar ${cls}"><span>${label}</span><div class="tr"><i style="width:${p}%"></i></div><span>${n}/${total}</span></div>`}
function resultHtml(id,i,t){
  const res=t.result,s=res.summary,v=s.verdict,icon={improved:"✓",inconclusive:"?","no change":"=",worse:"✕",regression:"✕",error:"!"}[v]||"";
  let h=`<div class="verdict-banner vb-${v.replace(" ","-")}"><span style="font-size:20px;line-height:1">${icon}</span><div><b>${esc(v)}</b>${esc(s.why)}</div></div>`;
  const rp=Math.round(s.reproduction_rate*100);
  h+=`<div class="metrics">
    <div class="metric"><h6>Simulator validity</h6><div class="gauge"><div class="bar ${rp>=30?"ok":"base"}" style="grid-template-columns:1fr 38px"><div class="tr"><i style="width:${rp}%"></i></div><span>${rp}%</span></div><div class="th" style="left:30%"></div></div><div class="note" style="margin-top:6px">Unpatched calls that reproduced the original failure. Needs 30% or more (line) to trust the comparison.</div></div>
    <div class="metric"><h6>Targeted failure: ${esc(res.parameter)}</h6><div class="bars">${bar("Unpatched",s.baseline.failed,s.baseline.n,"base")}${bar("Patched",s.patched.failed,s.patched.n,"pat")}</div><div class="note" style="margin-top:6px">Simulated calls where this check failed. Lower is better.</div></div>
    <div class="metric"><h6>Regression (passing calls)</h6>${s.has_controls?`<div class="bars">${bar("Unpatched",s.control_baseline.fatal,s.control_baseline.n,"base")}${bar("Patched",s.control_patched.fatal,s.control_patched.n,"pat")}</div><div class="note" style="margin-top:6px">Fatal results on calls that were already good.</div>`:`<div class="note">No passing call audited yet. Audit one (for example sample 144800859863) so patches can be checked for breakage.</div>`}</div></div>`;
  const p=res.persona;
  h+=`<details class="persona" data-key="pe:${i}" ${ui.open["pe:"+i]?"open":""} style="margin-top:12px"><summary>Simulated buyer</summary><div class="sm" style="margin-top:6px">${esc(p.product)} · ${esc(p.true_quantity_and_unit)} · ${esc(p.location)}<br>Specs: ${esc(p.specs_known.join(", ")||"not stated")}<br>Volunteers: ${esc(p.volunteers.join("; ")||"nothing")}<br>Quirks: ${esc(p.quirks.join("; ")||"none")}<br>Language: ${esc(p.language_style)} · Patience: ${esc(p.patience)}</div></details>`;
  h+=`<details class="runsd" data-key="ru:${i}" ${ui.open["ru:"+i]?"open":""} style="margin-top:10px"><summary>All ${res.cells.length} simulated calls</summary><table class="runs"><tr><th>Buyer</th><th>Prompt</th><th>Overall</th><th>Target</th><th></th></tr>`;
  res.cells.forEach((c,k)=>{const key=`c:${i}:${k}`;
    h+=`<tr><td>${c.kind==="control"?"control · ":""}${esc(c.style)}</td><td>${c.arm==="patched"?"Patched":"Unpatched"}</td><td>${c.overall?pill(c.overall):pill("Fatal","error")}</td><td>${c.error?"":c.target_failed?pill("Fatal","failed"):pill("Pass","ok")}</td><td style="text-align:right">${c.conversation.length?`<button class="btn tiny" data-conv="${key}">${ui.open[key]?"Hide":"View"}</button>`:""}</td></tr>`;
    if(ui.open[key])h+=`<tr><td colspan="5"><div class="convo"><div class="tx">${c.conversation.map(([w,tx])=>bubble(w,tx)).join("")}</div>
      <div style="margin-top:10px">${c.audio?`<audio controls src="/api/audio/${id}/${c.audio}?test=${i}"></audio>`:c.rendering?`<span class="spin"></span><span class="sm">Generating audio…</span>`:`<button class="btn tiny" data-render="${i}:${k}">Generate audio</button>${c.audio_error?` <span class="sm" style="color:var(--fatal)">${esc(c.audio_error)}</span>`:""}`}</div>
      ${c.failures.length?`<div class="note" style="margin-top:8px">Failed checks: ${esc(c.failures.map(f=>f.parameter+" ("+f.verdict+")").join(", "))}</div>`:""}</div></td></tr>`});
  h+=`</table></details><div class="note" style="margin-top:10px">${res.cells.length} simulated calls. Counts are small, so treat "improved" as strong evidence to try the patch on real traffic, not proof. The simulated bot uses the prompt's core plus relevant excerpts, not the full production prompt.</div>`;
  return h;
}

function wire(j){
  const m=$("#main");
  m.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ui.tab=b.dataset.tab;render(j)});
  const ra=$("#reaudit");if(ra)ra.onclick=async()=>{ra.disabled=true;ra.textContent="Starting…";try{await api(`/api/job/${j.id}/reaudit`,{method:"POST",body:"{}"});ui.last="";poll()}catch(e){alert(e.message);ra.disabled=false}};
  m.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{ui.filter=b.dataset.filter;ui.last="";poll()});
  m.querySelectorAll("details[data-key]").forEach(d=>d.addEventListener("toggle",()=>{ui.open[d.dataset.key]=d.open}));
  m.querySelectorAll("[data-runs]").forEach(b=>b.onclick=()=>{ui.runs=+b.dataset.runs;ui.last="";poll()});
  m.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(j.issues[+b.dataset.copy].proposed_patch);b.textContent="Copied";setTimeout(()=>b.textContent="Copy",1200)});
  m.querySelectorAll("[data-test]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api(`/api/job/${j.id}/test`,{method:"POST",body:JSON.stringify({issue:+b.dataset.test,runs:ui.runs})});ui.last="";poll()}catch(e){alert(e.message);b.disabled=false}});
  m.querySelectorAll("[data-conv]").forEach(b=>b.onclick=()=>{ui.open[b.dataset.conv]=!ui.open[b.dataset.conv];ui.last="";poll()});
  m.querySelectorAll("[data-render]").forEach(b=>b.onclick=async()=>{const[i,c]=b.dataset.render.split(":");b.disabled=true;try{await api(`/api/job/${j.id}/render`,{method:"POST",body:JSON.stringify({issue:+i,cell:+c})});ui.last="";poll()}catch(e){alert(e.message);b.disabled=false}});
}

let batchData=null;
async function renderBatch(){
  const m=$("#main");
  try{if(!batchData)batchData=await api("/api/batch")}catch(e){m.innerHTML=`<div class="card"><h3>Batch results</h3><div class="muted">No batch run yet. Run <code>python3 src/batch.py 10</code>.</div></div>`;return}
  const s=batchData.summary,R=batchData.results.filter(r=>!r.error);
  const pct=x=>{const[a,b]=x.split("/").map(Number);return b?Math.round(a/b*100):0};
  const oq=s.vs_overall_quality,cq=s.vs_call_quality;
  const tile=(v,l,c)=>`<div class="tile ${c||""}"><b>${v}</b><span>${l}</span></div>`;
  let h=`<div class="card hero"><div class="sp"><div><h2>Batch results</h2><div class="sm muted">${s.calls_audited} human-labelled SquadStack calls, audited by the same pipeline as the Audit page and compared with the auditors' labels</div></div></div>
   <div class="tiles">${tile(Math.round(s.share_audited*100)+"%","of calls audited","r")}${tile(s.parameter_agreement_pct+"%","parameter agreement ("+s.parameter_agreement_lenient+")","p")}${tile(oq.exact,"overall verdict exact match","p")}${tile(oq.fatal_recall,"human-Fatal calls caught","p")}</div>
   <div class="tiles">${tile(oq.fatal_precision,"agent-Fatal calls also Fatal for humans","n")}${tile(s.calls_flagged,"calls in the review queue","n")}${tile(s.disagreements_caught_by_review_flag,"disagreements caught by a flag","r")}${tile(s.disagreements,"parameter disagreements","f")}</div>
   <div class="note">Small sample (${s.calls_audited} calls): treat these as a first read, not a final number. Pass and NA are counted as the same. The human Overall Quality also includes lead-quality ratings that a transcript cannot show; the conversation-only comparison (Call Quality) is exact on ${cq.exact}.</div></div>`;
  const labels=["Fatal","Non-Fatal","Pass"];
  const mx=(c,title)=>{const rows=Object.keys(c).filter(k=>labels.includes(k)).sort((a,b)=>labels.indexOf(a)-labels.indexOf(b));
    return `<div><b class="sm">${title}</b><table class="mx" style="margin-top:6px"><tr><th>human \\ agent</th>${labels.map(l=>`<th>${l}</th>`).join("")}</tr>${rows.map(r=>`<tr><th>${r}</th>${labels.map(l=>{const n=c[r][l]||0;return `<td class="${!n?"z":r===l?"hit":"bad"}">${n}</td>`}).join("")}</tr>`).join("")}</table></div>`};
  h+=`<div class="card"><h3>Overall verdict: human vs agent</h3><div class="cols">${mx(oq.confusion_human_to_agent,"Against the human Overall Quality")}${mx(cq.confusion_human_to_agent,"Against the human Call Quality (conversation only)")}</div>
   <div class="note" style="margin-top:8px">Green is agreement; red is disagreement. The agent keeps the more severe reading when its two judge runs differ, so it errs towards Fatal.</div></div>`;
  const dp=s.disagreements_by_parameter,mxd=Math.max(1,...Object.values(dp).map(v=>v.length));
  h+=`<div class="card"><h3>Where agent and human disagree</h3>`+Object.entries(dp).map(([k,v])=>`<div class="bar" style="grid-template-columns:200px 1fr 34px;margin-bottom:6px"><span>${esc(k)}</span><div class="tr"><i style="width:${v.length/mxd*100}%;background:var(--brand)"></i></div><span>${v.length}</span></div>`).join("")+`<div class="note">Each disagreement is shown as human to agent, for example "Pass to Fatal" means the human passed it and the agent called it Fatal.</div></div>`;

  h+=`</section>
   <section><div class="sect-head"><h2>Keeping it honest in production</h2><p>Accuracy is measured continuously from the calls people review, not from a one-off test.</p></div><div class="trust">
    <div class="tbox"><h3>Human review so far</h3>${RS.reviewed_calls?`<div class="rowlist"><div><span>Calls reviewed</span><b>${RS.reviewed_calls}</b></div><div><span>Final verdict kept as the audit said</span><b>${RS.overall_kept_pct}%</b></div><div><span>Problems confirmed as real</span><b>${RS.problems_real_pct==null?"–":RS.problems_real_pct+"%"}</b></div><div><span>Pattern matches judged correct</span><b>${RS.match_accuracy_pct==null?"–":RS.match_accuracy_pct+"%"}</b></div><div><span>Problems the audit missed (added)</span><b>${RS.missed_problems_added}</b></div></div>`:`<p class="note" style="margin:0">No production call has been reviewed yet. Reviews made in the <a class="linkbtn" href="#review">review queue</a> show here as accuracy figures, and update as more calls are checked.</p>`}</div>
    <div class="tbox"><h3>Are the patterns sensible?</h3><div class="big2">${cover}%<small>of problems sit in a named pattern</small></div>
      <div class="rowlist"><div><span>Patterns</span><b>${d.quality.clusters}</b></div><div><span>Compared with a human's grouping</span><b>Not yet</b></div></div>
      <p class="note" style="margin:0">The patterns were drawn from the auditors' notes. To measure quality, a person groups the same ${d.issues} reviewed problems by hand and we compare. <a class="linkbtn" href="/api/insights/sheet">Download the sheet</a></p></div></div>
    ${d.vendor_note?`<p class="note" style="margin:12px 0 0">${esc(d.vendor_note)}</p>`:""}</section>`;

  h+=`</div>`;
  m.innerHTML=h;
  m.querySelectorAll("details[data-key]").forEach(el=>el.addEventListener("toggle",()=>{ui.open[el.dataset.key]=el.open}));
  m.querySelectorAll("[data-copychg]").forEach(btn=>btn.onclick=()=>{const t=insCache[insSrc].clusters[+btn.dataset.copychg].fix.change;const ok=()=>{btn.textContent="Copied";setTimeout(()=>btn.textContent="Copy text",1400)};
    (navigator.clipboard?navigator.clipboard.writeText(t).then(ok,()=>{}):Promise.reject()).catch(()=>{const r=document.createRange();r.selectNode($("#chg"+btn.dataset.copychg));getSelection().removeAllRanges();getSelection().addRange(r)})});
  const rb=$("#regroupbtn");if(rb)rb.onclick=async()=>{rb.disabled=true;try{await api("/api/regroup/start",{method:"POST",body:"{}"})}catch(e){}ui.lastov="";renderOverview()};
  m.querySelectorAll("[data-src]").forEach(b=>b.onclick=()=>{insSrc=b.dataset.src;ui.lastov="";renderOverview()});
  const ct=$("#ctoggle");if(ct)ct.onclick=()=>{ui.chartTable=!ui.chartTable;ui.lastov="";renderOverview()};
  m.querySelectorAll("[data-tip]").forEach(el=>{el.addEventListener("mousemove",e=>tip(e,el.dataset.tip));el.addEventListener("mouseleave",untip)});
}

loadSamples();poll();
</script>
</body>
</html>
